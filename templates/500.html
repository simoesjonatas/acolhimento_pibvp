<!DOCTYPE html>
<!--
  Pagina de erro 500 AUTOSSUFICIENTE de proposito.
  O handler padrao do Django (server_error) renderiza este template SEM request e
  SEM context processors. Por isso nao estendemos base.html nem usamos {% url %}/
  variaveis de contexto: se algo estiver quebrado, esta pagina ainda precisa abrir.
-->
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1f513a">
    <title>Erro no servidor - Acolhimento PIBVP</title>
    <style>
        :root { --verde: #1f513a; --texto: #1f2a24; --suave: #5b6b62; }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center;
            justify-content: center; padding: 24px;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #f2f5f3; color: var(--texto);
        }
        .card {
            background: #fff; border: 1px solid #e2e8e4; border-radius: 16px;
            padding: 40px 32px; max-width: 460px; width: 100%; text-align: center;
            box-shadow: 0 10px 30px rgba(31, 81, 58, .08);
        }
        .code { font-size: 3rem; font-weight: 800; color: var(--verde); line-height: 1; margin: 0; }
        h1 { font-size: 1.35rem; margin: 12px 0 8px; }
        p { color: var(--suave); line-height: 1.55; margin: 0 0 24px; }
        .btn {
            display: inline-block; background: var(--verde); color: #fff;
            text-decoration: none; padding: 12px 22px; border-radius: 10px;
            font-weight: 700; font-size: .95rem;
        }
        .btn:hover { background: #17402d; }
    </style>
</head>
<body>
    <main class="card">
        <p class="code">500</p>
        <h1>Algo deu errado</h1>
        <p>
            Tivemos um problema inesperado ao processar sua solicitacao.
            Nossa equipe foi notificada. Tente novamente em instantes.
        </p>
        <a class="btn" href="/">Voltar ao inicio</a>
    </main>
</body>
</html>
