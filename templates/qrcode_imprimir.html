<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Imprimir QR Code - {{ qrcode.nome }}</title>
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; background: #f4f5fc; color: #111; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
        .folha { max-width: 520px; margin: 0 auto; padding: 32px 24px; text-align: center; }
        .folha h1 { font-size: 1.5rem; margin: 0 0 4px; }
        .folha .sub { color: #555; margin: 0 0 22px; }
        .qr-box { display: inline-block; background: #fff; padding: 20px; border-radius: 14px; border: 1px solid #e2e2e2; }
        .qr-box svg { display: block; width: 300px; height: 300px; }
        .qr-box svg path { fill: #000; }
        .link { margin-top: 18px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .9rem; color: #333; word-break: break-all; }
        .toolbar { margin-top: 26px; display: flex; gap: 10px; justify-content: center; }
        .toolbar button, .toolbar a {
            display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px;
            border-radius: 10px; border: 1px solid #2323c6; background: #2323c6; color: #fff;
            font: inherit; font-weight: 600; cursor: pointer; text-decoration: none;
        }
        .toolbar a.secundario { background: #fff; color: #2323c6; }
        @media print {
            html, body { background: #fff; }
            .toolbar { display: none; }
            .folha { padding: 0; }
            .qr-box { border: none; padding: 0; }
        }
    </style>
</head>
<body>
    <div class="folha">
        <h1>{{ qrcode.nome }}</h1>
        <p class="sub">Aponte a camera do celular para o QR Code</p>
        <div class="qr-box">{{ qrcode_svg|safe }}</div>
        <p class="link">{{ link_publico }}</p>
        <div class="toolbar">
            <button type="button" onclick="window.print()">Imprimir</button>
            <a class="secundario" href="{% url 'qrcodes-detalhe' qrcode.pk %}">Voltar</a>
        </div>
    </div>
</body>
</html>
