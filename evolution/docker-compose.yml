name: evolution-sandbox

# Ambiente ISOLADO só para testes do Evolution API (avaliação para substituir a Twilio).
# Nao interfere no docker-compose.yml do projeto: outra rede, outros volumes, outro prefixo.
# Somente a API publica porta no host, e apenas em 127.0.0.1 (localhost) -> porta 8085.
# Postgres e Redis ficam internos a esta stack (sem porta no host), evitando conflito.

services:
  evolution-postgres:
    image: postgres:16-alpine
    container_name: evolution-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution_pass
      TZ: America/Sao_Paulo
    volumes:
      - evolution_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 10s
      timeout: 5s
      retries: 5

  evolution-redis:
    image: redis:7-alpine
    container_name: evolution-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - evolution_redis:/data

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: evolution-api
    restart: unless-stopped
    depends_on:
      evolution-postgres:
        condition: service_healthy
      evolution-redis:
        condition: service_started
    ports:
      # host 127.0.0.1:8085 -> container 8080. Django (host:8000) e o navegador acessam via localhost:8085.
      - "127.0.0.1:8085:8080"
    extra_hosts:
      # Permite ao container alcancar o Django rodando no host (webhook de entrada).
      - "host.docker.internal:host-gateway"
    environment:
      SERVER_URL: http://localhost:8085
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-pibvp-teste-2026}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"

      # Banco (Prisma / Postgres)
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution_pass@evolution-postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"

      # Cache (Redis)
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"

      # Aparencia da sessao (nome que aparece em "Aparelhos conectados" no WhatsApp)
      CONFIG_SESSION_PHONE_CLIENT: PIBVP-Acolhimento
      CONFIG_SESSION_PHONE_NAME: Chrome
      QRCODE_LIMIT: "30"
      LANGUAGE: pt-BR
      TELEMETRY_ENABLED: "false"
    volumes:
      - evolution_instances:/evolution/instances

volumes:
  evolution_pg:
  evolution_redis:
  evolution_instances:
