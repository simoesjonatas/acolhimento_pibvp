name: pibvp-evolution

# Stack separada do Evolution API.
# - O app Django continua no docker-compose.yml da raiz.
# - A API fica publicada apenas no localhost do servidor por padrao.
# - A rede `pibvp-evolution-net` permite plugar outros servicos/compose depois.
#   Eles podem chamar a API por http://evolution-api:8080 ao entrar nessa rede.

services:
  evolution-postgres:
    image: postgres:16-alpine
    container_name: pibvp-evolution-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${EVOLUTION_DB_NAME:-evolution}
      POSTGRES_USER: ${EVOLUTION_DB_USER:-evolution}
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD:-troque-esta-senha-evolution-no-env}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - evolution_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - evolution_internal

  evolution-redis:
    image: redis:7-alpine
    container_name: pibvp-evolution-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - evolution_redis:/data
    networks:
      - evolution_internal

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: pibvp-evolution-api
    restart: unless-stopped
    depends_on:
      evolution-postgres:
        condition: service_healthy
      evolution-redis:
        condition: service_started
    ports:
      # host 127.0.0.1:8085 -> container 8080. Nao expoe o Evolution direto na internet.
      - "${EVOLUTION_HOST_BIND:-127.0.0.1}:${EVOLUTION_HOST_PORT:-8085}:8080"
    extra_hosts:
      # Permite ao Evolution chamar webhooks em servicos publicados no host.
      - "host.docker.internal:host-gateway"
    environment:
      SERVER_URL: ${EVOLUTION_SERVER_URL:-http://localhost:8085}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-troque-esta-chave-evolution-no-env}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"

      # Banco (Prisma / Postgres)
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${EVOLUTION_DB_USER:-evolution}:${EVOLUTION_DB_PASSWORD:-troque-esta-senha-evolution-no-env}@evolution-postgres:5432/${EVOLUTION_DB_NAME:-evolution}?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"

      # Cache (Redis)
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"

      # Webhooks serao configurados por instancia pelo Django em /webhook/set/{instance}.
      # Mantemos o global desligado para evitar eventos duplicados quando houver outros servicos.
      WEBHOOK_GLOBAL_ENABLED: "false"
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"

      # Aparencia da sessao (nome que aparece em "Aparelhos conectados" no WhatsApp)
      CONFIG_SESSION_PHONE_CLIENT: ${EVOLUTION_SESSION_PHONE_CLIENT:-PIBVP-Acolhimento}
      CONFIG_SESSION_PHONE_NAME: ${EVOLUTION_SESSION_PHONE_NAME:-Chrome}
      QRCODE_LIMIT: ${EVOLUTION_QRCODE_LIMIT:-30}
      LANGUAGE: ${EVOLUTION_LANGUAGE:-pt-BR}
      TELEMETRY_ENABLED: "false"
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - evolution_internal
      - evolution_shared

volumes:
  evolution_pg:
  evolution_redis:
  evolution_instances:

networks:
  evolution_internal:
  evolution_shared:
    name: ${EVOLUTION_DOCKER_NETWORK:-pibvp-evolution-net}
