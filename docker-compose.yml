name: pibvp-acolhimento

services:
  db:
    image: postgres:16-alpine
    container_name: pibvp-acolhimento-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-acolhimento_pibvp}
      POSTGRES_USER: ${POSTGRES_USER:-acolhimento}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-troque-esta-senha-no-env}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # O Postgres NAO publica porta no host: apenas o container `web` acessa pela
    # rede interna do projeto (db:5432). Isso evita conflito com os outros
    # Postgres do servidor (as portas de host 5432 e 5433 ja estao em uso).
    # Para acessar do host (pgAdmin/backup), descomente abaixo — 5434 esta livre
    # e o bind em 127.0.0.1 mantem o banco fora da rede publica:
    # ports:
    #   - "127.0.0.1:${DB_HOST_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
    container_name: pibvp-acolhimento-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      # Permite que o container Django acesse stacks Docker separadas publicadas
      # no host, como o Evolution em 127.0.0.1:8085.
      - "host.docker.internal:host-gateway"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-troque-esta-chave-em-producao}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-acolhimento.simoesti.com.br,localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-https://acolhimento.simoesti.com.br,http://localhost:8183,http://127.0.0.1:8183}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-False}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://acolhimento.simoesti.com.br}
      POSTGRES_DB: ${POSTGRES_DB:-acolhimento_pibvp}
      POSTGRES_USER: ${POSTGRES_USER:-acolhimento}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-troque-esta-senha-no-env}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      # Opt-in-first: sem repassar estas, o .env do servidor era ignorado e o botao
      # "falar com a gente" da tela de sucesso do auto-cadastro nunca aparecia.
      PIB_WHATSAPP_NUMERO_OPTIN: ${PIB_WHATSAPP_NUMERO_OPTIN:-}
      PIB_WHATSAPP_OPTIN_TEXTO: ${PIB_WHATSAPP_OPTIN_TEXTO:-}
      HORAS_ESPERA_OPTIN: ${HORAS_ESPERA_OPTIN:-0}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-evolution}
      EVOLUTION_BASE_URL: ${EVOLUTION_BASE_URL:-http://host.docker.internal:8085}
      EVOLUTION_PUBLIC_URL: ${EVOLUTION_PUBLIC_URL:-http://127.0.0.1:8085}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-troque-esta-chave-evolution-no-env}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-pibvp-producao}
      EVOLUTION_INTEGRATION: ${EVOLUTION_INTEGRATION:-WHATSAPP-BAILEYS}
      EVOLUTION_WEBHOOK_URL: ${EVOLUTION_WEBHOOK_URL:-https://acolhimento.simoesti.com.br/acolhimento/mensagens/webhook/evolution/}
      EVOLUTION_WEBHOOK_EVENTS: ${EVOLUTION_WEBHOOK_EVENTS:-MESSAGES_UPSERT,MESSAGES_UPDATE}
      EVOLUTION_WEBHOOK_BY_EVENTS: ${EVOLUTION_WEBHOOK_BY_EVENTS:-False}
      EVOLUTION_WEBHOOK_BASE64: ${EVOLUTION_WEBHOOK_BASE64:-False}
      EVOLUTION_WEBHOOK_SECRET: ${EVOLUTION_WEBHOOK_SECRET:-}
      EVOLUTION_AUTO_CONFIGURE_WEBHOOK: ${EVOLUTION_AUTO_CONFIGURE_WEBHOOK:-True}
      # Sem default aqui de proposito: o texto padrao tem {nome}, e default com
      # chaves na interpolacao do Compose foi exatamente a origem do bug do {}}.
      # Vazio => o settings.py aplica o texto padrao.
      EVOLUTION_TEXTO_OPTIN: ${EVOLUTION_TEXTO_OPTIN:-}
      EVOLUTION_TEXTO_CONTINUAR: ${EVOLUTION_TEXTO_CONTINUAR:-}
      TWILIO_ENABLED: ${TWILIO_ENABLED:-False}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-whatsapp:+14155238886}
      TWILIO_STATUS_CALLBACK_URL: ${TWILIO_STATUS_CALLBACK_URL:-}
      TWILIO_TEMPLATE_OPT_IN_SID: ${TWILIO_TEMPLATE_OPT_IN_SID:-}
      # Sem default com chaves aninhadas (${...:-{}}): o parser de interpolacao do
      # Compose varia entre versoes e pode deixar um '}' sobrando. Vazio => o
      # settings.py usa '{}'.
      TWILIO_TEMPLATE_OPT_IN_VARIABLES: ${TWILIO_TEMPLATE_OPT_IN_VARIABLES:-}
      TWILIO_TEMPLATE_CONTINUAR_SID: ${TWILIO_TEMPLATE_CONTINUAR_SID:-}
      TWILIO_TEMPLATE_CONTINUAR_VARIABLES: ${TWILIO_TEMPLATE_CONTINUAR_VARIABLES:-}
    ports:
      - "${APP_PORT:-8183}:8000"

volumes:
  postgres_data:
